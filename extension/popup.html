<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyFlow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Toast Message -->
  <div id="message" class="message"></div>

  <!-- ═══ LOGIN VIEW ═══ -->
  <div id="loginView" class="view">
    <div class="login-header">
      <img src="logo.png" alt="ApplyFlow" class="logo-mark" />
      <h1 class="logo-title">ApplyFlow</h1>
      <p class="login-tagline" data-i18n="tagline">Autofill job applications faster.</p>
    </div>

    <div class="login-body">
      <button id="syncFromWebsiteBtn" class="btn btn-gradient">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        <span data-i18n="syncFromWebsite">Sync from Website</span>
      </button>
      <button id="loginOnWebsiteBtn" class="btn btn-outline">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        <span data-i18n="loginOnWebsite">Login on Website</span>
      </button>

      <div class="divider"><span data-i18n="orSignInWith">or sign in with email</span></div>

      <form id="loginForm">
        <div class="field">
          <input type="email" id="email" required placeholder="Email address" data-i18n-placeholder="emailPlaceholder">
        </div>
        <div class="field">
          <input type="password" id="password" required placeholder="Password" data-i18n-placeholder="passwordPlaceholder">
        </div>
        <button type="submit" class="btn btn-gradient">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          <span data-i18n="signIn">Sign In</span>
        </button>
      </form>
      <div id="loginError" class="error-msg"></div>
    </div>
  </div>

  <!-- ═══ PROFILE VIEW ═══ -->
  <div id="profileView" class="view hidden">
    <!-- Compact Header -->
    <div class="prof-header">
      <div class="prof-left">
        <img src="logo.png" alt="ApplyFlow" class="logo-mark-sm" />
        <div class="prof-info">
          <span id="userEmail" class="prof-email"></span>
          <span class="badge-ok"><span class="dot-green"></span><span data-i18n="connected">Connected</span></span>
        </div>
      </div>
      <button id="logoutBtn" class="btn-icon-danger" title="Logout" data-i18n-title="logout">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        <span data-i18n="logout">Logout</span>
      </button>
    </div>

    <div class="prof-scroll">
      <!-- Quick Actions -->
      <div class="card">
        <div class="action-row">
          <button id="autofillBtn" class="action-card action-primary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            <span data-i18n="autofill">Autofill</span>
          </button>
          <button id="uploadCvToPageBtn" class="action-card action-secondary">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span data-i18n="uploadCv">Upload CV</span>
          </button>
        </div>
        <p class="hint" data-i18n="worksOnMost">Works on most job application forms.</p>
      </div>

      <!-- CV Assistant -->
      <div class="card">
        <h3 class="card-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <span data-i18n="cvAssistant">CV Assistant</span>
        </h3>
        <div id="cvInfo" class="cv-row">
          <span class="status-indicator"></span>
          <span id="cvText" class="cv-status-label" data-i18n="loading">Loading...</span>
        </div>
        <div id="cvFileName" class="cv-filename"></div>
        <div id="cvActions" class="cv-pills hidden">
          <button id="openCvBtn" class="pill" title="Open CV in new tab">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span data-i18n="open">Open</span>
          </button>
          <button id="copyCvLinkBtn" class="pill" title="Copy CV link">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            <span data-i18n="link">Link</span>
          </button>
          <button id="copyFileNameBtn" class="pill" title="Copy file name">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span data-i18n="name">Name</span>
          </button>
        </div>
      </div>

      <!-- Save Application -->
      <div class="card card-last">
        <h3 class="card-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          <span data-i18n="saveApplication">Save Application</span>
        </h3>
        <form id="saveApplicationForm" class="save-form">
          <div class="row-2">
            <div class="field">
              <label for="companyName" data-i18n="company">Company *</label>
              <input type="text" id="companyName" placeholder="Google" required data-i18n-placeholder="companyPlaceholder">
            </div>
            <div class="field">
              <label for="position" data-i18n="position">Position *</label>
              <input type="text" id="position" placeholder="Software Eng." required data-i18n-placeholder="positionPlaceholder">
            </div>
          </div>
          <div class="field">
            <label for="jobUrl" data-i18n="jobUrl">Job URL</label>
            <input type="url" id="jobUrl" readonly class="input-readonly">
          </div>
          <div class="row-2">
            <div class="field">
              <label for="dateApplied" data-i18n="date">Date</label>
              <input type="date" id="dateApplied">
            </div>
            <div class="field">
              <label for="note" data-i18n="note">Note</label>
              <input type="text" id="note" placeholder="Optional..." data-i18n-placeholder="notePlaceholder">
            </div>
          </div>
          <p class="hint" style="margin-bottom:8px" data-i18n="reviewBeforeSaving">Review before saving.</p>
          <button type="submit" class="btn btn-gradient btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            <span data-i18n="saveApplication">Save Application</span>
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
